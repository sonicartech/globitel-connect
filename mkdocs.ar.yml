    - 'أختبر الكاميرا والميكرفون': './Getting-started/Testing-your-camera-and-microphone.md'
    - 'سجل المكالمات': './Getting-started/Interaction-history.md'
    - 'سجل المواعيد': './Getting-started/Appointments.md'
    - 'جاهز لإستقبال مكالمات': './Getting-started/Getting-ready-for-engagements.md'
  - 'التفاعل مع العملاء':
