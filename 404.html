<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found · Globitel Connect</title>
    <script>
      // Links without a language prefix (e.g. /Getting-started/Login/) open the English guide.
      (function (l) {
        if (!/^\/(en|ar)(\/|$)/.test(l.pathname)) {
          l.replace("/en" + l.pathname + l.search + l.hash);
        }
      })(window.location);
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #36454f; background: #fff; text-align: center; padding: 16px; }
      a { color: #b4540a; font-weight: 600; }
      @media (prefers-color-scheme: dark) { body { color: #f4f4f4; background: #1e2129; } a { color: #ffa557; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist.</p>
      <p><a href="/en/">Go to the English guide</a> · <a href="/ar/" lang="ar">الانتقال إلى الدليل العربي</a></p>
    </main>
  </body>
</html>
